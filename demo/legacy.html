<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebEditor — IIFE(script 태그) 데모</title>
  <!-- 레거시 페이지 사용 방식: 번들 파일 2개만 로드 -->
  <link rel="stylesheet" href="../dist/webeditor.css" />
  <style>
    body { max-width: 820px; margin: 0 auto; padding: 32px 20px;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  </style>
</head>
<body>
  <h1>IIFE 번들 데모 (레거시 script 태그 방식)</h1>
  <div id="editor"></div>

  <script src="../dist/webeditor.iife.min.js"></script>
  <script>
    // 전역 WebEditor 로 접근 (모듈 시스템 불필요 — Classic ASP 페이지 등)
    var editor = WebEditor.createEditor('#editor', {
      placeholder: 'IIFE 번들로 동작 중…',
      initialHTML: '<p>레거시 페이지에서 <strong>script 태그</strong>만으로 사용.</p>',
    });
    window.__editor = editor;
  </script>
</body>
</html>
